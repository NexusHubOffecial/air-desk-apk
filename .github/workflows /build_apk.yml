name: Build Native Android 15 APK (AirDesk Native Pro)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android15-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Native Python Kivy App to Android 15 APK
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: Upload Ready-to-Install Android 15 APK
        uses: actions/upload-artifact@v4
        with:
          name: AirDeskNativePro-Android15-APK
          path: bin/*.apk
