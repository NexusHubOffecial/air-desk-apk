name: Build Native Android 15 APK (AirDesk Native Pro)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android15-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer & Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev automake gettext lld
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Build Android 15 APK
        run: |
          yes | buildozer -v android debug

      - name: Upload Ready-to-Install Android 15 APK
        uses: actions/upload-artifact@v4
        with:
          name: AirDeskNativePro-Android15-APK
          path: bin/*.apk
